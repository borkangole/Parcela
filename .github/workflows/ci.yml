name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: parcela
          POSTGRES_PASSWORD: parcela
          POSTGRES_DB: parcela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://parcela:parcela@localhost:5432/parcela

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
